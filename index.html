<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fceef3;
            font-family: Arial, sans-serif;
        }

        .diary {
            width: 85%;
            max-width: 450px;
            padding: 35px 25px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .diary h1 {
            color: #5c3a2e;
        }

        .diary p {
            color: #777;
        }

        #jumpscare {
            display: none;
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
        }

        #jumpscare video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="diary">
        <h1>♡ My Diary ♡</h1>
        <p>Opening my diary...</p>
        <p>Please wait...</p>
    </div>

    <div id="jumpscare">
        <video id="scareVideo" playsinline>
            <source src="jumpscare.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        setTimeout(function () {
            const screen = document.getElementById("jumpscare");
            const video = document.getElementById("scareVideo");

            screen.style.display = "block";
            video.currentTime = 0;
            video.play();
        }, 3000);
    </script>

</body>
</html>
